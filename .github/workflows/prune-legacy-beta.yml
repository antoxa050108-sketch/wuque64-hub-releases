name: Prune explicitly selected legacy beta binaries
on:
  push:
    branches: [maintenance/prune-legacy-beta-20261127]
    paths:
      - '.github/workflows/prune-legacy-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wuque-legacy-beta-prune
  cancel-in-progress: false
jobs:
  prune:
    if: github.repository == 'antoxa050108-sketch/wuque64-hub-releases' && github.ref == 'refs/heads/maintenance/prune-legacy-beta-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only snapshotted legacy EXE and blockmap assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile, pathlib
          repo = "antoxa050108-sketch/wuque64-hub-releases"
          root = "repos/" + repo
